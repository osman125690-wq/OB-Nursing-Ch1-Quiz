<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:linear-gradient(135deg,#faf6f2 0%,#f4efec 100%); font-family:'Segoe UI','Tajawal','Cairo',sans-serif; color:#2b2f36; padding:20px; min-height:100vh; }
.container { max-width:800px; margin:0 auto; }
.made-for { text-align:center; margin:4px 0 18px 0; }

.stage-btn { background:#2a6f95; width:100%; text-align:right; display:flex; justify-content:space-between; align-items:center; }
.stage-btn .badge { font-size:13px; background:#1a4f6d; padding:3px 12px; border-radius:15px; }
.back-btn { background:#4a8260; border:none; padding:10px 20px; border-radius:30px; color:white; cursor:pointer; margin-bottom:15px; display:inline-block; }
.quiz-card { background:#ffffff; border-radius:20px; padding:20px; border:1px solid #e8ddd3; box-shadow:0 8px 28px rgba(80,60,45,.07); margin-top:20px; }
.question-text { font-size:18px; font-weight:bold; margin-bottom:6px; line-height:1.6; direction:ltr; text-align:left; }
.question-ar { font-size:15px; color:#5f6b76; margin-bottom:16px; border-bottom:1px solid #e6dcd2; padding-bottom:10px; line-height:1.7; }
.option-item { background:#fdfaf7; border-radius:15px; padding:12px; margin:8px 0; border:1px solid #e2d8cd; cursor:pointer; line-height:1.6; }
.option-item .opt-ar { display:block; font-size:13px; color:#6b7684; margin-top:2px; }
.option-item .opt-en { direction:ltr; display:block; text-align:left; }
.option-item:hover { background:#f4ede5; }
.option-item.locked { cursor:default; }
.option-correct { background:#10b981 !important; border-color:#10b981 !important; color:#03251a; }
.option-correct .opt-ar, .option-wrong .opt-ar { color:inherit; }
.option-wrong { background:#ef4444 !important; border-color:#ef4444 !important; color:#2b0505; }
.feedback { background:#f0f6fb; border-radius:12px; padding:12px; margin:10px 0; border-right:4px solid #3b82f6; line-height:1.7; }
.feedback.correct { border-right-color:#10b981; background:#ecfdf3; }
.feedback.wrong { border-right-color:#ef4444; background:#fef1f1; }
.score-board { background:#efe8e0; color:#4a3f34; padding:5px 15px; border-radius:25px; display:inline-block; margin-bottom:15px; }
.progress-wrap { background:#e9e0d6; border-radius:25px; height:8px; margin:0 0 15px 0; overflow:hidden; }
.progress-bar { background:#10b981; height:100%; transition:width .3s; }
.nav-buttons { display:flex; gap:10px; margin-top:20px; }
.nav-btn { flex:1; }
.hidden { display:none !important; }
.small-back { background:#4a8260; border:none; padding:5px 12px; border-radius:20px; color:white; cursor:pointer; font-size:12px; margin-bottom:10px; display:inline-block; }
.motivation { background:#fdf7e8; border:1px dashed #dcc79c; border-radius:15px; padding:10px 15px; margin:15px 0; text-align:center; font-size:15px; color:#92610e; min-height:44px; }
.mistakes-box { background:#f8f3ec; border:1px solid #eee3d6; padding:15px; border-radius:15px; margin-top:15px; text-align:right; }
.mistakes-box li { margin-bottom:12px; line-height:1.7; }
.mistakes-box .m-en { direction:ltr; text-align:left; display:block; }
.results-hero { text-align:center; }
.reset-btn { background:#f7e6e6; border:none; padding:8px 16px; border-radius:20px; color:#b0524f; cursor:pointer; font-size:12px; margin-top:20px; }
</style>
</head>

<script>
// ===== True/False: 46 questions (OB ch.1) =====
const tfData = [
{en:"If the Oocyte is fertilized, the corpus luteum remains active for 20 weeks of gestation.",ar:"إذا تم تخصيب البويضة، يبقى الجسم الأصفر نشطًا لمدة 20 أسبوعًا من الحمل",c:true,ex:"عند حدوث التخصيب يظل الجسم الأصفر نشطًا بفعل هرمون HCG لإفراز البروجسترون الداعم للحمل، ويستمر نشطًا حوالي 20 أسبوعًا."},
{en:"Secretory phase begins with menstruation and ends with ovulation.",ar:"تبدأ المرحلة الإفرازية مع الحيض وتنتهي بالإباضة",c:false,ex:"تصحيح: المرحلة الإفرازية تبدأ بالإباضة وتنتهي مع الحيض، فهي النصف الثاني من الدورة تحت تأثير البروجسترون."},
{en:"Skene's ducts open on either side of the vaginal orifice.",ar:"تفتح قنوات سكين على جانبي فتحة المهبل",c:false,ex:"تصحيح: قنوات سكين تفتح على جانبي فتحة الإحليل (urethral) وليس فتحة المهبل."},
{en:"The uterus is composed of three layers.",ar:"يتكون الرحم من ثلاث طبقات",c:true,ex:"الرحم يتكون من ثلاث طبقات: البطانة (endometrium) والعضلة (myometrium) والغلاف المصلي (perimetrium)."},
{en:"Vitamin B metabolizes the excessive amounts of estrogen.",ar:"يستقلب فيتامين ب الكميات الزائدة من هرمون الاستروجين",c:false,ex:"تصحيح: فيتامين ب يحيّد (neutralizes) الكميات الزائدة من الإستروجين وليس يستقلبها (metabolizes)."},
{en:"Vestibule has a specific shape.",ar:"يأخذ الدهليز شكلا محددًا",c:true,ex:"صحيح كما هو مثبت في الكتاب (مع ملاحظة مكتوبة «عليه خلاف»): الدهليز له شكل محدد يشبه القارب."},
{en:"Isthmus is the widest portion of the fallopian tube.",ar:"البرزخ هو أوسع جزء من قناة فالوب",c:false,ex:"تصحيح: البرزخ هو أضيق (narrowest) جزء من قناة فالوب، أما الأوسع فهو الأمبولة."},
{en:"The perineum is the muscle and tissue located between the vaginal opening and anal canal.",ar:"العجان هو العضلات والأنسجة الواقعة بين فتحة المهبل والقناة الشرجية",c:true,ex:"العجان هو العضلات والأنسجة الواقعة بين فتحة المهبل والقناة الشرجية."},
{en:"The female reproductive cycle is composed only of the ovarian cycle.",ar:"تتكون الدورة التناسلية للأنثى من الدورة المبيضية فقط",c:false,ex:"تصحيح: الدورة التناسلية للأنثى تتكون من الدورة الشهرية (menstrual) والدورة المبيضية (ovarian) معًا."},
{en:"The urethral meatus is situated 5 cm below the clitoris.",ar:"يقع مخرج الإحليل على بعد 5 سم أسفل البظر",c:false,ex:"تصحيح: مخرج الإحليل يقع على بعد 2.5 سم أسفل البظر وليس 5 سم."},
{en:"The most common elements of reproductive health include women's nutrition, infertility management, and family planning services.",ar:"تشمل العناصر الشائعة لصحة الإنجاب تغذية النساء وإدارة العقم وخدمات تنظيم الأسرة",c:true,ex:"من أشهر عناصر الصحة الإنجابية: تغذية المرأة، إدارة العقم، وخدمات تنظيم الأسرة."},
{en:"The upper rounded portion of the uterus is called the fundus.",ar:"يسمى الجزء العلوي المستدير من الرحم بقاع الرحم",c:true,ex:"الجزء العلوي المستدير من الرحم هو القاع (fundus)."},
{en:"The placenta secretes follicle-stimulating hormone (FSH) and luteinizing hormone (LH).",ar:"تفرز المشيمة هرمون تحفيز الجريب وهرمون التبويض",c:false,ex:"تصحيح: FSH وLH يُفرزان من الغدة النخامية (pituitary gland) وليس من المشيمة."},
{en:"The area between the vaginal opening and anus is called labia minora.",ar:"المنطقة بين فتحة المهبل وفتحة الشرج تسمى الشفرين الصغيرين",c:false,ex:"تصحيح: المنطقة بين فتحة المهبل والشرج تسمى العجان (perineum) وليس الشفرين الصغيرين."},
{en:"The widest part of the fallopian tube is called cilia.",ar:"أوسع جزء من قناة فالوب يسمى الأهداب",c:false,ex:"تصحيح: أوسع جزء من قناة فالوب هو الأمبولة (ampulla)، أما الأهداب فزوائد مبطنة للقناة تساعد على تحريك البويضة."},
{en:"Episiotomy is an incision of the perineum for widening the vaginal opening.",ar:"شق العجان هو شق في العجان لتوسيع فتحة المهبل",c:true,ex:"شق العجان (episiotomy) شق جراحي في العجان لتوسيع فتحة المهبل أثناء الولادة."},
{en:"The female sex hormone is testosterone.",ar:"الهرمون الجنسي الأنثوي هو التستوستيرون",c:false,ex:"تصحيح: الهرمونات الجنسية الأنثوية هي الإستروجين والبروجسترون، أما التستوستيرون فهرمون ذكري أساسًا."},
{en:"The uterus is a pear-shaped organ.",ar:"الرحم هو عضو على شكل كمثرى",c:true,ex:"الرحم عضو مجوف على شكل ثمرة الكمثرى (pear-shaped)."},
{en:"The hypothalamus releases GnRH, and the pituitary secretes estrogen.",ar:"يفرز الوطاء هرمون GnRH والغدة النخامية تفرز الاستروجين",c:false,ex:"تصحيح: الغدة النخامية تفرز FSH وLH، أما الإستروجين فيُفرز من المبيض."},
{en:"One strategy for improving reproductive health is to delay early marriage.",ar:"إحدى استراتيجيات تحسين الصحة الإنجابية هي تأخير الزواج المبكر",c:true,ex:"تأخير الزواج المبكر من استراتيجيات تحسين الصحة الإنجابية."},
{en:"Implantation begins 4 days after fertilization.",ar:"يبدأ الانغراس بعد 4 أيام من التخصيب",c:false,ex:"تصحيح: الانغراس يبدأ بعد حوالي 6 أيام من التخصيب وليس 4 أيام."},
{en:"The proliferative phase is a phase of repair and proliferation.",ar:"المرحلة التكاثرية هي مرحلة الإصلاح والتكاثر",c:true,ex:"المرحلة التكاثرية هي مرحلة إصلاح بطانة الرحم وتكاثرها تحت تأثير الإستروجين."},
{en:"Ovulation is the expulsion of a mature ovum.",ar:"الإباضة هي طرد بويضة ناضجة",c:true,ex:"الإباضة هي خروج (طرد) البويضة الناضجة من الجريب."},
{en:"The clitoris is not a sensitive organ.",ar:"البظر ليس عضوًا حساسًا",c:false,ex:"تصحيح: البظر عضو حساس (sensitive) جدًا لغناه بالنهايات العصبية."},
{en:"The upper part of the uterus is called the isthmus.",ar:"الجزء العلوي من الرحم يسمى البرزخ",c:false,ex:"تصحيح: الجزء العلوي من الرحم هو القاع (fundus)، أما البرزخ فمنطقة ضيقة أسفل جسم الرحم."},
{en:"FSH and LH produce cyclic changes in the ovaries.",ar:"يؤدي هرمونا FSH وLH إلى تغييرات دورية في المبيضين",c:true,ex:"FSH وLH يسببان التغيرات الدورية في المبيضين: نضج الجريب ثم الإباضة."},
{en:"The vagina connects the cervix to the external genitalia.",ar:"يربط المهبل بين عنق الرحم والأعضاء التناسلية الخارجية",c:true,ex:"المهبل يربط عنق الرحم بالأعضاء التناسلية الخارجية."},
{en:"The vagina is a passageway for menstrual flow.",ar:"المهبل هو ممر لتدفق الحيض",c:true,ex:"المهبل هو الممر الذي يخرج منه دم الحيض."},
{en:"The menstrual cycle contains the luteal phase.",ar:"تحتوي الدورة الشهرية على المرحلة الأصفرية",c:false,ex:"تصحيح: الطور الأصفر (luteal) جزء من الدورة المبيضية (ovarian cycle) وليس الدورة الشهرية."},
{en:"The proliferative phase is controlled by estrogen secreted by follicles.",ar:"يتم التحكم في المرحلة التكاثرية بواسطة الاستروجين الذي تفرزه الجريبات",c:true,ex:"المرحلة التكاثرية تحت تأثير الإستروجين المفرز من الجريبات النامية."},
{en:"The Pituitary hormone that stimulates the ovary at the start of menstrual cycle is Luteinizing hormone (L.H).",ar:"الهرمون النخامي الذي يحفز المبيض في بداية الدورة الشهرية هو الهرمون الملوتن (LH)",c:false,ex:"تصحيح: الهرمون المحفز للمبيض في بداية الدورة هو هرمون تحفيز الجريب FSH وليس LH."},
{en:"The labia minora lie just inside the labia majora and surround the openings of vagina & urethra.",ar:"الشفران الصغيران يقعان داخل الشفرين الكبيرين ويحيطان بفتحات المهبل والإحليل",c:true,ex:"الشفران الصغيران يقعان مباشرة داخل الشفرين الكبيرين ويحيطان بفتحتي المهبل والإحليل."},
{en:"Infundibulum is the part of fallopian tube that fertilization takes place.",ar:"القمع هو الجزء من قناة فالوب الذي يحدث فيه الإخصاب",c:false,ex:"تصحيح: الإخصاب يحدث في الأمبولة (ampulla) وليس في القمع (infundibulum)."},
{en:"Bartholin's glands are located on either side of urethral meatus.",ar:"غدد بارثولين تقع على جانبي فتحة الإحليل",c:false,ex:"تصحيح: غدد بارثولين تقع على جانبي فتحة المهبل (vaginal orifice) وليس الإحليل."},
{en:"Isthmus is the part of fallopian tube that acts as reservoir for spermatozoa.",ar:"البرزخ هو الجزء من قناة فالوب الذي يعمل كمستودع للحيوانات المنوية",c:true,ex:"البرزخ يعمل كمستودع للحيوانات المنوية قبل حدوث الإخصاب."},
{en:"Bartholin's glands secretes thick mucus that supplies lubrication for intercourse and enhances the viability and motility of the sperm.",ar:"غدد بارثولين تفرز مخاطًا كثيفًا يوفر التزييت أثناء الجماع ويعزز حيوية وحركة الحيوانات المنوية",c:true,ex:"إفراز غدد بارثولين يرطّب ويزيّت أثناء الجماع ويعزز حيوية وحركة الحيوانات المنوية."},
{en:"The female reproductive cycle composed of menstrual cycle only.",ar:"دورة الجهاز التناسلي للأنثى تتكون من الدورة الشهرية فقط",c:false,ex:"تصحيح: الدورة التناسلية للأنثى تتكون من الدورة الشهرية والدورة المبيضية معًا."},
{en:"During proliferative phase spiral arteries grow into the superficial layer.",ar:"خلال المرحلة التكاثرية، تنمو الشرايين الحلزونية في الطبقة السطحية",c:false,ex:"تصحيح: نمو الشرايين الحلزونية في الطبقة السطحية يحدث في المرحلة الإفرازية (secretory) وليس التكاثرية."},
{en:"From reproductive health rights; right to life, liberty and security.",ar:"من حقوق الصحة الإنجابية: الحق في الحياة، الحرية والأمان",c:true,ex:"من حقوق الصحة الإنجابية: الحق في الحياة والحرية والأمان."},
{en:"Using any form of warm application may be beneficial during painful periods of menstruation.",ar:"استخدام أي شكل من أشكال الكمادات الدافئة قد يكون مفيدًا خلال فترات الحيض المؤلمة",c:true,ex:"الكمادات الدافئة تخفف آلام الحيض وتساعد على ارتخاء العضلات."},
{en:"Vestibule is appear shape.",ar:"الدهليز له شكل محدد (القبو)",c:false,ex:"تصحيح: الدهليز له شكل القارب (boat shape)."},
{en:"Zygote is the result of fertilization.",ar:"الزيجوت هو نتيجة الإخصاب",c:true,ex:"الزيجوت هو الخلية الناتجة من اتحاد البويضة مع الحيوان المنوي (صحيح)."},
{en:"Immediately after fertilization the zygote has 47 chromosomes.",ar:"تحتوي الزيجوت على 47 كروموسوم",c:false,ex:"تصحيح: الزيجوت يحتوي على 46 كروموسوم (23 من الأم و23 من الأب) وليس 47."},
{en:"If fertilization doesn't occur HCG hormone is secreted in urine.",ar:"إذا لم يحدث الإخصاب، يُفرز هرمون HCG في البول",c:false,ex:"تصحيح: عند عدم حدوث الإخصاب لا يُفرز هرمون HCG، لأنه يُفرز من الأرومة الغاذية بعد الانغراس فقط."},
{en:"Normal site of implantation is in the endometrium of the anterior wall of the fundus of the uterus.",ar:"المكان الطبيعي لانغراس البويضة المخصبة هو بطانة الجدار الأمامي لقاع الرحم",c:true,ex:"المكان الطبيعي للانغراس هو بطانة الجدار الأمامي لقاع الرحم."},
{en:"Ovulation occurs about the end of the cycle.",ar:"يحدث التبويض تقريبًا في نهاية الدورة",c:false,ex:"تصحيح: التبويض يحدث حول منتصف الدورة (around mid-cycle) وليس في نهايتها."}
];
// ===== MCQ: 34 questions (OB ch.1) =====
// Each option: [English, Arabic gloss]. correct = option index.

// ===================== أدوات =====================
function shuffleArray(arr){ for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function $(id){ return document.getElementById(id); }
function saveKey(type,stage){ return "obQuizV1_"+type+"_"+stage; }
function getSource(type){ return type==="mcq" ? mcqData : tfData; }
function rotateMotivation(el){ if(!el) return; el.textContent = PHRASES[Math.floor(Math.random()*PHRASES.length)]; }
setInterval(()=>{ rotateMotivation($("motivationMain")); rotateMotivation($("motivationStages")); rotateMotivation($("motivationQuiz")); }, 6000);

// ===================== حالة اللعبة =====================
let currentList=[], currentOrder=[], currentIndex=0, currentType="", currentStage=0;
let userAnswers=[], answered=false, answeredIdx=null;

function buildStageList(type,stage){
  const src=getSource(type), [a,b]=STAGES[type][stage-1];
  currentOrder=[]; for(let i=a;i<b;i++) currentOrder.push(i);
  shuffleArray(currentOrder);
  currentList=currentOrder.map(i=>src[i]);
}
function persist(){
  localStorage.setItem(saveKey(currentType,currentStage),
    JSON.stringify({order:currentOrder, index:currentIndex, answers:userAnswers, done:false}));
}
function markDone(score){
  localStorage.setItem(saveKey(currentType,currentStage),
    JSON.stringify({order:currentOrder, index:currentIndex, answers:userAnswers, done:true, score:score, total:currentList.length}));
}
function clearSaved(type,stage){ localStorage.removeItem(saveKey(type,stage)); }

// ===================== التنقل بين الشاشات =====================
function showScreen(name){
  $("mainMenu").classList.toggle("hidden", name!=="main");
  $("stagesMenu").classList.toggle("hidden", name!=="stages");
  $("quizArea").classList.toggle("hidden", name!=="quiz");
  $("resultsScreen").classList.toggle("hidden", name!=="results");
}
function backToMain(){ resetState(); showScreen("main"); rotateMotivation($("motivationMain")); }
function backToStages(){ showStages(currentType); }

function resetState(){ currentList=[]; currentOrder=[]; currentIndex=0; userAnswers=[]; answered=false; answeredIdx=null; }

// ===================== قائمة المراحل =====================
function showStages(type){
  resetState();
  currentType=type;
  $("stagesTitle").textContent = type==="mcq" ? "📖 مراحل اختر الإجابة الصحيحة" : "✅ مراحل صح / خطأ";
  let html="";
  for(let s=1;s<=STAGES[type].length;s++){
    const [a,b]=STAGES[type][s-1];
    const saved=localStorage.getItem(saveKey(type,s));
    let badge=`${b-a} سؤال`;
    if(saved){
      try{
        const d=JSON.parse(saved);
        if(d.done) badge=`✅ ${d.score}/${d.total}`;
        else if(d.answers && d.answers.some(x=>x)) badge=`⏸️ متوقف عند ${d.index+1}/${b-a}`;
      }catch(e){}
    }
    html+=`<button class="stage-btn" onclick="startStage(${s},'${type}')"><span>🎯 المرحلة ${s}</span><span class="badge">${badge}</span></button>`;
  }
  $("stagesList").innerHTML=html;
  showScreen("stages");
  rotateMotivation($("motivationStages"));
}

function startStage(stage,type){
  resetState();
  currentStage=stage; currentType=type;
  const saved=localStorage.getItem(saveKey(type,stage));
  if(saved){
    let d=null;
    try{ d=JSON.parse(saved); }catch(e){}
    if(d && d.done){
      if(!confirm(`خلصت المرحلة دي قبل كده ودرجتك ${d.score}/${d.total}.\nتحب تعيدها من الأول؟`)){ showStages(type); return; }
      clearSaved(type,stage);
    } else if(d && d.order && d.answers && d.answers.some(x=>x)){
      if(confirm(`في تقدم محفوظ للمرحلة دي (واقف عند سؤال ${d.index+1}).\nOK = أكمل من حيث وقفت\nCancel = ابدأ من جديد`)){
        const src=getSource(type);
        currentOrder=d.order;
        currentList=currentOrder.map(i=>src[i]);
        currentIndex=Math.min(d.index, currentList.length-1);
        userAnswers=d.answers;
        showScreen("quiz");
        renderQuiz();
        return;
      }
      clearSaved(type,stage);
    }
  }
  buildStageList(type,stage);
  currentIndex=0; userAnswers=[];
  showScreen("quiz");
  renderQuiz();
}

// ===================== عرض السؤال =====================
function renderQuiz(){
  if(currentIndex>=currentList.length){ showResults(); return; }
  const q=currentList[currentIndex];
  const correctCount=userAnswers.filter(a=>a&&a.correct).length;
  $("scoreDisplay").textContent=`⭐ ${correctCount}/${currentList.length}`;
  $("progressBar").style.width=((currentIndex)/currentList.length*100)+"%";
  $("questionText").textContent=(currentIndex+1)+". "+q.en;
  $("questionAr").textContent=q.ar||"";
  const prev=userAnswers[currentIndex];
  answered=!!prev; answeredIdx=prev?prev.picked:null;

  if(currentType==="mcq"){
    $("optionsDiv").innerHTML="";
    q.o.forEach((opt,idx)=>{
      const div=document.createElement("div");
      div.className="option-item"+(answered?" locked":"");
      div.innerHTML=`<span class="opt-en">${opt[0]}</span>`+(opt[1]?`<span class="opt-ar">${opt[1]}</span>`:"");
      div.onclick=()=>checkMCQ(idx);
      if(answered){
        if(idx===q.c) div.classList.add("option-correct");
        else if(idx===prev.picked) div.classList.add("option-wrong");
      }
      $("optionsDiv").appendChild(div);
    });
  } else {
    const labels=[[true,"✅ صح (True)"],[false,"❌ خطأ (False)"]];
    $("optionsDiv").innerHTML="";
    labels.forEach(([val,label],idx)=>{
      const div=document.createElement("div");
      div.className="option-item"+(answered?" locked":"");
      div.textContent=label;
      div.onclick=()=>checkTF(val,idx);
      if(answered){
        if(val===q.c) div.classList.add("option-correct");
        else if(idx===prev.picked) div.classList.add("option-wrong");
      }
      $("optionsDiv").appendChild(div);
    });
  }

  if(answered) showFeedback(prev.correct, q);
  else $("feedbackDiv").innerHTML="";
  rotateMotivation($("motivationQuiz"));
}

function correctAnswerText(q){
  if(currentType==="mcq") return q.o[q.c][0];
  return q.c ? "صح (True)" : "خطأ (False)";
}

function showFeedback(isCorrect,q){
  $("feedbackDiv").innerHTML=
    `<div class="feedback ${isCorrect?"correct":"wrong"}"><strong>${isCorrect?"✅ إجابة صحيحة!":"❌ إجابة خطأ"}</strong><br>📘 الإجابة الصحيحة: ${correctAnswerText(q)}<br>${q.ex}</div>`;
}

function lockAndPaint(pickedIsCorrect){
  const items=$("optionsDiv").querySelectorAll(".option-item");
  const q=currentList[currentIndex];
  items.forEach((el,idx)=>{
    el.classList.add("locked");
    el.onclick=null;
    const isCorrectOpt = currentType==="mcq" ? (idx===q.c) : ((idx===0)===q.c);
    if(isCorrectOpt) el.classList.add("option-correct");
    else if(idx===pickedIdx) el.classList.add("option-wrong");
  });
}
let pickedIdx=null;

function checkMCQ(idx){
  if(answered) return;
  const q=currentList[currentIndex];
  pickedIdx=idx;
  const isCorrect=(idx===q.c);   // المقارنة بالرقم مش بالنص
  userAnswers[currentIndex]={picked:idx, correct:isCorrect};
  answered=true;
  lockAndPaint(isCorrect);
  showFeedback(isCorrect,q);
  persist();
  const correctCount=userAnswers.filter(a=>a&&a.correct).length;
  $("scoreDisplay").textContent=`⭐ ${correctCount}/${currentList.length}`;
}

function checkTF(val,idx){
  if(answered) return;
  const q=currentList[currentIndex];
  pickedIdx=idx;
  const isCorrect=(val===q.c);
  userAnswers[currentIndex]={picked:idx, correct:isCorrect};
  answered=true;
  lockAndPaint(isCorrect);
  showFeedback(isCorrect,q);
  persist();
  const correctCount=userAnswers.filter(a=>a&&a.correct).length;
  $("scoreDisplay").textContent=`⭐ ${correctCount}/${currentList.length}`;
}

// ===================== شاشة النتيجة =====================
function showResults(){
  const correct=userAnswers.filter(a=>a&&a.correct).length;
  const total=currentList.length;
  markDone(correct);
  $("resultsScore").textContent=`درجتك: ${correct} / ${total}`;
  const pct=correct/total;
  $("resultsMsg").textContent = pct===1 ? "ممتاز! علامة كاملة، إنت وحش 🏆" : pct>=0.75 ? "كويس جدًا! شوية مراجعة وتبقى تمام 💪" : pct>=0.5 ? "ماشي الحال.. راجع أخطاءك وحاول تاني 📚" : "متزعلش، الغلط أول خطوة للفهم. راجع وجرب تاني 🌱";
  let wrongHtml="";
  currentList.forEach((q,i)=>{
    const a=userAnswers[i];
    if(!a||!a.correct){
      wrongHtml+=`<li><span class="m-en"><strong>${q.en}</strong></span>
        ✅ الإجابة الصحيحة: ${correctAnswerText(q)}<br>📘 ${q.ex}</li>`;
    }
  });
  $("mistakesBox").innerHTML = wrongHtml
    ? `<h3>❌ راجع أخطاءك:</h3><ul style="list-style:none; margin-top:10px;">${wrongHtml}</ul>`
    : `<div style="text-align:center;">🎉 لا توجد أخطاء! إتقان رائع 🎉</div>`;
  $("progressBar").style.width="100%";
  showScreen("results");
  const hasNext=currentStage<STAGES[currentType].length;
  $("nextStageBtn").style.display=hasNext?"":"none";
}

// ===================== التنقل بين الأسئلة =====================
function moveNext(){
  if(!answered){
    $("feedbackDiv").innerHTML='<div class="feedback wrong"><strong>⚠️ تنبيه</strong><br>اختار إجابة الأول يا نجم 😄</div>';
    return;
  }
  currentIndex++;
  persist();
  renderQuiz();
}
function movePrev(){
  if(currentIndex>0){ currentIndex--; renderQuiz(); }
}

// ===================== ربط الأزرار =====================
$("mcqBtn").onclick=()=>showStages("mcq");
$("tfBtn").onclick=()=>showStages("tf");
$("backToMainBtn").onclick=backToMain;
$("backToStagesBtn").onclick=backToStages;
$("resultsBackBtn").onclick=backToStages;
$("nextBtn").onclick=moveNext;
$("prevBtn").onclick=movePrev;
$("replayBtn").onclick=()=>{ clearSaved(currentType,currentStage); const s=currentStage,t=currentType; resetState(); currentStage=s; currentType=t; buildStageList(t,s); currentIndex=0; userAnswers=[]; showScreen("quiz"); renderQuiz(); };
$("nextStageBtn").onclick=()=>{ startStage(currentStage+1,currentType); };
$("resetBtn").onclick=()=>{
  if(confirm("متأكد إنك عايز تمسح كل التقدم المحفوظ؟")){
    ["tf","mcq"].forEach(t=>STAGES[t].forEach((_,i)=>clearSaved(t,i+1)));
    alert("اتمسح ✅ يلا نبدأ من جديد!");
  }
};

rotateMotivation($("motivationMain"));
window.startStage=startStage;
window.backToStages=backToStages;
</script>
</body>
</html>
