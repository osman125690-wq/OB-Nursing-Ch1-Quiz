<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4efec">
<title>كويز تفاعلي لمادة النساء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4d3533;
  --ink70: rgba(77,53,51,.7);
  --hairline: rgba(77,53,51,.1);
  --teal: #73a89a;
  --red: #ed313e;
  --bg: #f4efec;
  --card: #fdfcfb;
  --serif: "Noto Naskh Arabic", Georgia, "Times New Roman", serif;
  --sans: "Noto Sans Arabic", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:24px;
  min-height:100vh;
}
button { font-family:inherit; cursor:pointer; }
.eyebrow {
  text-align:center;
  padding:20px 16px 16px;
  font-size:13px;
  color:var(--ink70);
  letter-spacing:.3px;
}
.card {
  background:var(--card);
  border-radius:24px 24px 0 0;
  box-shadow:0 1px 2px rgba(37,31,33,.06), 0 6px 18px rgba(37,31,33,.05);
  max-width:560px;
  margin:0 auto;
  padding:32px 24px 48px;
  min-height:calc(100vh - 60px);
}
.title { font-family:var(--serif); font-size:28px; line-height:1.25; font-weight:500; color:var(--ink); }
.fact { color:var(--teal); font-size:14px; font-weight:600; margin-top:6px; }
.intro { font-size:14px; line-height:24px; color:var(--ink); margin-top:12px; }
.hero { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:8px; margin-top:20px; display:block; }
.caption { font-size:12px; line-height:20px; color:var(--ink70); margin-top:8px; }
.grouplabel { font-family:var(--serif); font-size:21px; line-height:1.2; font-weight:500; color:var(--ink); margin:0 0 12px; }
.section { margin-top:36px; animation:fadein .3s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:999px; padding:10px 20px; font-size:14px; line-height:14px;
  border:1px solid transparent; transition:all .2s ease;
}
.btn-primary { background:var(--ink); color:var(--card); border-color:var(--ink); box-shadow:0 1px 2px rgba(37,31,33,.05); }
.btn-primary:hover { opacity:.88; }
.btn-secondary { background:#fff; color:var(--ink); border-color:var(--hairline); box-shadow:0 1px 2px rgba(37,31,33,.05); }
.btn-secondary:hover { border-color:rgba(77,53,51,.3); }
.btn-ghost { background:transparent; color:var(--ink); }
.btn-ghost:hover { background:rgba(77,53,51,.05); }
.btn-compact { padding:8px 16px; font-size:13px; }
.btnrow { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
.motivation { border:1px dashed var(--hairline); border-radius:12px; padding:10px 14px; margin:12px 0; text-align:center; color:var(--ink70); font-size:14px; line-height:24px; transition:opacity .3s; }
.stagelist { display:flex; flex-direction:column; gap:8px; }
.stage {
  width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px;
  background:none; border:1px solid var(--hairline); border-radius:12px; padding:14px 16px;
  font-size:15px; color:var(--ink); text-align:start; transition:border-color .2s;
}
.stage:hover { border-color:var(--teal); }
.badge { color:var(--ink70); font-size:13px; white-space:nowrap; }
.stagechoice { display:flex; flex-wrap:wrap; gap:8px; padding:8px 4px 0; animation:fadein .25s ease; }
.scorebar { display:flex; justify-content:space-between; gap:12px; color:var(--ink70); font-size:13px; margin:16px 0 8px; }
.track { background:var(--hairline); border-radius:99px; height:6px; overflow:hidden; margin-bottom:18px; }
.fill { background:var(--teal); height:100%; transition:width .3s; }
.q { font-size:17px; font-weight:600; line-height:26px; text-align:left; color:var(--ink); direction:ltr; }
.qar { font-size:14px; line-height:24px; color:var(--ink70); margin-top:6px; padding-bottom:12px; border-bottom:1px solid var(--hairline); }
.options { display:flex; flex-direction:column; gap:8px; margin:14px 0; }
.opt {
  border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; background:none;
  font-size:14px; line-height:22px; color:var(--ink); text-align:start; transition:border-color .2s, background .2s;
  width:100%;
}
.opt:hover { border-color:var(--teal); }
.opt.locked { cursor:default; }
.opt.correct { border:2px solid var(--teal); background:rgba(115,168,154,.16); font-weight:600; padding:11px 13px; }
.opt.wrong { border:2px solid var(--red); background:rgba(237,49,62,.08); padding:11px 13px; }
.opt .open { display:block; text-align:left; direction:ltr; }
.opt .opar { display:block; color:var(--ink70); font-size:13px; margin-top:2px; }
.opt.correct .opar, .opt.wrong .opar { color:inherit; }
.feedback { border-radius:12px; padding:12px 14px; margin:10px 0; font-size:14px; line-height:24px; border-inline-start:4px solid var(--hairline); animation:fadein .25s ease; }
.feedback.ok { border-inline-start-color:var(--teal); background:rgba(115,168,154,.12); }
.feedback.no { border-inline-start-color:var(--red); background:rgba(237,49,62,.07); }
.nav { display:flex; gap:8px; margin-top:16px; }
.nav > * { flex:1; }
.results { text-align:center; padding:8px 0 4px; }
.bigscore { font-size:21px; font-weight:600; color:var(--ink); }
.resultmsg { color:var(--ink70); font-size:14px; margin-top:4px; }
.mistakes { margin:12px 0; }
.mtitle { font-weight:600; margin-bottom:8px; }
.mitem { border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin-bottom:8px; font-size:14px; line-height:24px; }
.men { font-weight:600; text-align:left; direction:ltr; margin-bottom:4px; }
.mex { color:var(--ink70); }
.closing { margin-top:48px; font-size:14px; line-height:24px; color:var(--ink70); }
</style>
</head>
<body>
<div class="eyebrow">✨ Made by Osman ✨</div>
<main class="card">
  <h1 class="title">كويز تفاعلي لمادة النساء</h1>
  
  
  <img class="hero" src="hero.jpg" alt="رسم توضيحي لموضوع تمريض النسا والتوليد">
  <div id="app"></div>
  
</main>
<script>
const DATA = {"STAGES":{"tf":[[0,16],[16,31],[31,46]],"mcq":[[0,12],[12,23],[23,34]]},"PHRASES":["إنت مش بتحل أسئلة، إنت بتبني اسمك في المهنة دي 🔥","البنك ده هيخلص.. والسؤال هو: هتخلصه إنت ولا هو اللي هيخلصك؟ 💀","زمايلك نايمين دلوقتي. إنت هنا. دي الفرق بينك وبينهم 😈","سؤال واحد كمان.. البطل بيكمل لما الكل يوقف 🏆","مفيش سؤال في البنك ده أقوى منك. مفيش ❌","شد حيلك.. رائحة الامتياز واصلة لحد هنا 🌟","الغلط هنا مجاني. في الامتحان بفلوس. غلط براحتك واتعلم 🎯","إنت قدها وقدود، والدليل إنك لسه مكمل لحد السؤال ده 🚀","آخر سؤال في المرحلة مش نهاية.. دي بداية مرحلة أحلى 🔥"],"tfData":[{"en":"If the Oocyte is fertilized, the corpus luteum remains active for 20 weeks of gestation.","ar":"إذا تم تخصيب البويضة، يبقى الجسم الأصفر نشطًا لمدة 20 أسبوعًا من الحمل","c":true,"ex":"عند حدوث التخصيب يظل الجسم الأصفر نشطًا بفعل هرمون HCG لإفراز البروجسترون الداعم للحمل، ويستمر نشطًا حوالي 20 أسبوعًا."},{"en":"Secretory phase begins with menstruation and ends with ovulation.","ar":"تبدأ المرحلة الإفرازية مع الحيض وتنتهي بالإباضة","c":false,"ex":"تصحيح: المرحلة الإفرازية تبدأ بالإباضة وتنتهي مع الحيض، فهي النصف الثاني من الدورة تحت تأثير البروجسترون."},{"en":"Skene's ducts open on either side of the vaginal orifice.","ar":"تفتح قنوات سكين على جانبي فتحة المهبل","c":false,"ex":"تصحيح: قنوات سكين تفتح على جانبي فتحة الإحليل (urethral) وليس فتحة المهبل."},{"en":"The uterus is composed of three layers.","ar":"يتكون الرحم من ثلاث طبقات","c":true,"ex":"الرحم يتكون من ثلاث طبقات: البطانة (endometrium) والعضلة (myometrium) والغلاف المصلي (perimetrium)."},{"en":"Vitamin B metabolizes the excessive amounts of estrogen.","ar":"يستقلب فيتامين ب الكميات الزائدة من هرمون الاستروجين","c":false,"ex":"تصحيح: فيتامين ب يحيّد (neutralizes) الكميات الزائدة من الإستروجين وليس يستقلبها (metabolizes)."},{"en":"Vestibule has a specific shape.","ar":"يأخذ الدهليز شكلا محددًا","c":true,"ex":"صحيح كما هو مثبت في الكتاب (مع ملاحظة مكتوبة «عليه خلاف»): الدهليز له شكل محدد يشبه القارب."},{"en":"Isthmus is the widest portion of the fallopian tube.","ar":"البرزخ هو أوسع جزء من قناة فالوب","c":false,"ex":"تصحيح: البرزخ هو أضيق (narrowest) جزء من قناة فالوب، أما الأوسع فهو الأمبولة."},{"en":"The perineum is the muscle and tissue located between the vaginal opening and anal canal.","ar":"العجان هو العضلات والأنسجة الواقعة بين فتحة المهبل والقناة الشرجية","c":true,"ex":"العجان هو العضلات والأنسجة الواقعة بين فتحة المهبل والقناة الشرجية."},{"en":"The female reproductive cycle is composed only of the ovarian cycle.","ar":"تتكون الدورة التناسلية للأنثى من الدورة المبيضية فقط","c":false,"ex":"تصحيح: الدورة التناسلية للأنثى تتكون من الدورة الشهرية (menstrual) والدورة المبيضية (ovarian) معًا."},{"en":"The urethral meatus is situated 5 cm below the clitoris.","ar":"يقع مخرج الإحليل على بعد 5 سم أسفل البظر","c":false,"ex":"تصحيح: مخرج الإحليل يقع على بعد 2.5 سم أسفل البظر وليس 5 سم."},{"en":"The most common elements of reproductive health include women's nutrition, infertility management, and family planning services.","ar":"تشمل العناصر الشائعة لصحة الإنجاب تغذية النساء وإدارة العقم وخدمات تنظيم الأسرة","c":true,"ex":"من أشهر عناصر الصحة الإنجابية: تغذية المرأة، إدارة العقم، وخدمات تنظيم الأسرة."},{"en":"The upper rounded portion of the uterus is called the fundus.","ar":"يسمى الجزء العلوي المستدير من الرحم بقاع الرحم","c":true,"ex":"الجزء العلوي المستدير من الرحم هو القاع (fundus)."},{"en":"The placenta secretes follicle-stimulating hormone (FSH) and luteinizing hormone (LH).","ar":"تفرز المشيمة هرمون تحفيز الجريب وهرمون التبويض","c":false,"ex":"تصحيح: FSH وLH يُفرزان من الغدة النخامية (pituitary gland) وليس من المشيمة."},{"en":"The area between the vaginal opening and anus is called labia minora.","ar":"المنطقة بين فتحة المهبل وفتحة الشرج تسمى الشفرين الصغيرين","c":false,"ex":"تصحيح: المنطقة بين فتحة المهبل والشرج تسمى العجان (perineum) وليس الشفرين الصغيرين."},{"en":"The widest part of the fallopian tube is called cilia.","ar":"أوسع جزء من قناة فالوب يسمى الأهداب","c":false,"ex":"تصحيح: أوسع جزء من قناة فالوب هو الأمبولة (ampulla)، أما الأهداب فزوائد مبطنة للقناة تساعد على تحريك البويضة."},{"en":"Episiotomy is an incision of the perineum for widening the vaginal opening.","ar":"شق العجان هو شق في العجان لتوسيع فتحة المهبل","c":true,"ex":"شق العجان (episiotomy) شق جراحي في العجان لتوسيع فتحة المهبل أثناء الولادة."},{"en":"The female sex hormone is testosterone.","ar":"الهرمون الجنسي الأنثوي هو التستوستيرون","c":false,"ex":"تصحيح: الهرمونات الجنسية الأنثوية هي الإستروجين والبروجسترون، أما التستوستيرون فهرمون ذكري أساسًا."},{"en":"The uterus is a pear-shaped organ.","ar":"الرحم هو عضو على شكل كمثرى","c":true,"ex":"الرحم عضو مجوف على شكل ثمرة الكمثرى (pear-shaped)."},{"en":"The hypothalamus releases GnRH, and the pituitary secretes estrogen.","ar":"يفرز الوطاء هرمون GnRH والغدة النخامية تفرز الاستروجين","c":false,"ex":"تصحيح: الغدة النخامية تفرز FSH وLH، أما الإستروجين فيُفرز من المبيض."},{"en":"One strategy for improving reproductive health is to delay early marriage.","ar":"إحدى استراتيجيات تحسين الصحة الإنجابية هي تأخير الزواج المبكر","c":true,"ex":"تأخير الزواج المبكر من استراتيجيات تحسين الصحة الإنجابية."},{"en":"Implantation begins 4 days after fertilization.","ar":"يبدأ الانغراس بعد 4 أيام من التخصيب","c":false,"ex":"تصحيح: الانغراس يبدأ بعد حوالي 6 أيام من التخصيب وليس 4 أيام."},{"en":"The proliferative phase is a phase of repair and proliferation.","ar":"المرحلة التكاثرية هي مرحلة الإصلاح والتكاثر","c":true,"ex":"المرحلة التكاثرية هي مرحلة إصلاح بطانة الرحم وتكاثرها تحت تأثير الإستروجين."},{"en":"Ovulation is the expulsion of a mature ovum.","ar":"الإباضة هي طرد بويضة ناضجة","c":true,"ex":"الإباضة هي خروج (طرد) البويضة الناضجة من الجريب."},{"en":"The clitoris is not a sensitive organ.","ar":"البظر ليس عضوًا حساسًا","c":false,"ex":"تصحيح: البظر عضو حساس (sensitive) جدًا لغناه بالنهايات العصبية."},{"en":"The upper part of the uterus is called the isthmus.","ar":"الجزء العلوي من الرحم يسمى البرزخ","c":false,"ex":"تصحيح: الجزء العلوي من الرحم هو القاع (fundus)، أما البرزخ فمنطقة ضيقة أسفل جسم الرحم."},{"en":"FSH and LH produce cyclic changes in the ovaries.","ar":"يؤدي هرمونا FSH وLH إلى تغييرات دورية في المبيضين","c":true,"ex":"FSH وLH يسببان التغيرات الدورية في المبيضين: نضج الجريب ثم الإباضة."},{"en":"The vagina connects the cervix to the external genitalia.","ar":"يربط المهبل بين عنق الرحم والأعضاء التناسلية الخارجية","c":true,"ex":"المهبل يربط عنق الرحم بالأعضاء التناسلية الخارجية."},{"en":"The vagina is a passageway for menstrual flow.","ar":"المهبل هو ممر لتدفق الحيض","c":true,"ex":"المهبل هو الممر الذي يخرج منه دم الحيض."},{"en":"The menstrual cycle contains the luteal phase.","ar":"تحتوي الدورة الشهرية على المرحلة الأصفرية","c":false,"ex":"تصحيح: الطور الأصفر (luteal) جزء من الدورة المبيضية (ovarian cycle) وليس الدورة الشهرية."},{"en":"The proliferative phase is controlled by estrogen secreted by follicles.","ar":"يتم التحكم في المرحلة التكاثرية بواسطة الاستروجين الذي تفرزه الجريبات","c":true,"ex":"المرحلة التكاثرية تحت تأثير الإستروجين المفرز من الجريبات النامية."},{"en":"The Pituitary hormone that stimulates the ovary at the start of menstrual cycle is Luteinizing hormone (L.H).","ar":"الهرمون النخامي الذي يحفز المبيض في بداية الدورة الشهرية هو الهرمون الملوتن (LH)","c":false,"ex":"تصحيح: الهرمون المحفز للمبيض في بداية الدورة هو هرمون تحفيز الجريب FSH وليس LH."},{"en":"The labia minora lie just inside the labia majora and surround the openings of vagina & urethra.","ar":"الشفران الصغيران يقعان داخل الشفرين الكبيرين ويحيطان بفتحات المهبل والإحليل","c":true,"ex":"الشفران الصغيران يقعان مباشرة داخل الشفرين الكبيرين ويحيطان بفتحتي المهبل والإحليل."},{"en":"Infundibulum is the part of fallopian tube that fertilization takes place.","ar":"القمع هو الجزء من قناة فالوب الذي يحدث فيه الإخصاب","c":false,"ex":"تصحيح: الإخصاب يحدث في الأمبولة (ampulla) وليس في القمع (infundibulum)."},{"en":"Bartholin's glands are located on either side of urethral meatus.","ar":"غدد بارثولين تقع على جانبي فتحة الإحليل","c":false,"ex":"تصحيح: غدد بارثولين تقع على جانبي فتحة المهبل (vaginal orifice) وليس الإحليل."},{"en":"Isthmus is the part of fallopian tube that acts as reservoir for spermatozoa.","ar":"البرزخ هو الجزء من قناة فالوب الذي يعمل كمستودع للحيوانات المنوية","c":true,"ex":"البرزخ يعمل كمستودع للحيوانات المنوية قبل حدوث الإخصاب."},{"en":"Bartholin's glands secretes thick mucus that supplies lubrication for intercourse and enhances the viability and motility of the sperm.","ar":"غدد بارثولين تفرز مخاطًا كثيفًا يوفر التزييت أثناء الجماع ويعزز حيوية وحركة الحيوانات المنوية","c":true,"ex":"إفراز غدد بارثولين يرطّب ويزيّت أثناء الجماع ويعزز حيوية وحركة الحيوانات المنوية."},{"en":"The female reproductive cycle composed of menstrual cycle only.","ar":"دورة الجهاز التناسلي للأنثى تتكون من الدورة الشهرية فقط","c":false,"ex":"تصحيح: الدورة التناسلية للأنثى تتكون من الدورة الشهرية والدورة المبيضية معًا."},{"en":"During proliferative phase spiral arteries grow into the superficial layer.","ar":"خلال المرحلة التكاثرية، تنمو الشرايين الحلزونية في الطبقة السطحية","c":false,"ex":"تصحيح: نمو الشرايين الحلزونية في الطبقة السطحية يحدث في المرحلة الإفرازية (secretory) وليس التكاثرية."},{"en":"From reproductive health rights; right to life, liberty and security.","ar":"من حقوق الصحة الإنجابية: الحق في الحياة، الحرية والأمان","c":true,"ex":"من حقوق الصحة الإنجابية: الحق في الحياة والحرية والأمان."},{"en":"Using any form of warm application may be beneficial during painful periods of menstruation.","ar":"استخدام أي شكل من أشكال الكمادات الدافئة قد يكون مفيدًا خلال فترات الحيض المؤلمة","c":true,"ex":"الكمادات الدافئة تخفف آلام الحيض وتساعد على ارتخاء العضلات."},{"en":"Vestibule is appear shape.","ar":"الدهليز له شكل محدد (القبو)","c":false,"ex":"تصحيح: الدهليز له شكل القارب (boat shape)."},{"en":"Zygote is the result of fertilization.","ar":"الزيجوت هو نتيجة الإخصاب","c":true,"ex":"الزيجوت هو الخلية الناتجة من اتحاد البويضة مع الحيوان المنوي (صحيح)."},{"en":"Immediately after fertilization the zygote has 47 chromosomes.","ar":"تحتوي الزيجوت على 47 كروموسوم","c":false,"ex":"تصحيح: الزيجوت يحتوي على 46 كروموسوم (23 من الأم و23 من الأب) وليس 47."},{"en":"If fertilization doesn't occur HCG hormone is secreted in urine.","ar":"إذا لم يحدث الإخصاب، يُفرز هرمون HCG في البول","c":false,"ex":"تصحيح: عند عدم حدوث الإخصاب لا يُفرز هرمون HCG، لأنه يُفرز من الأرومة الغاذية بعد الانغراس فقط."},{"en":"Normal site of implantation is in the endometrium of the anterior wall of the fundus of the uterus.","ar":"المكان الطبيعي لانغراس البويضة المخصبة هو بطانة الجدار الأمامي لقاع الرحم","c":true,"ex":"المكان الطبيعي للانغراس هو بطانة الجدار الأمامي لقاع الرحم."},{"en":"Ovulation occurs about the end of the cycle.","ar":"يحدث التبويض تقريبًا في نهاية الدورة","c":false,"ex":"تصحيح: التبويض يحدث حول منتصف الدورة (around mid-cycle) وليس في نهايتها."}],"mcqData":[{"en":"The female internal reproductive organs include:","ar":"تشمل الأعضاء التناسلية الداخلية للأنثى:","o":[["Ovaries, fallopian tubes, clitoris","المبايض، قناتا فالوب، البظر"],["Ovaries, vestibule, Bartholin's glands","المبايض، الدهليز، غدد بارثولين"],["Fallopian tubes, ovaries, vagina","قناتا فالوب، المبايض، المهبل"],["Fallopian tubes, uterus, vagina, and ovaries","قناتا فالوب، الرحم، المهبل، والمبايض"]],"c":3,"ex":"الأعضاء التناسلية الداخلية للأنثى هي: المبيضان وقناتا فالوب والرحم والمهبل؛ أما البظر والدهليز وغدد بارثولين فأعضاء خارجية."},{"en":"If fertilization doesn't occur:","ar":"إذا لم يحدث الإخصاب:","o":[["Corpus luteum degenerates","الجسم الأصفر يتدهور"],["Menstruation occurs","يحدث الحيض"],["Estrogen & progesterone levels fall","تنخفض مستويات الإستروجين والبروجسترون"],["All the above","جميع ما سبق"]],"c":3,"ex":"عند عدم حدوث الإخصاب يتحلل الجسم الأصفر فتنخفض مستويات الإستروجين والبروجسترون ويحدث الحيض؛ لذلك جميع ما سبق."},{"en":"Divisions of the uterus include all the following except:","ar":"تشمل تقسيمات الرحم جميع ما يلي باستثناء:","o":[["The corpus or body","الجسم أو البدن"],["Ampulla","الأمبولة"],["The fundus","القاع"], ogen and Progesterone","الإستروجين والبروجسترون"],["a and b","أ و ب"]],"c":3,"ex":"الغدة النخامية الأمامية تفرز LH وFSH وكلاهما يتحكم في الإباضة."},{"en":"functions of the vagina is include:","ar":"تشمل وظائف المهبل:","o":[["birth canal during delivery","قناة الولادة أثناء الوضع"],["passage way for menstrual flow","مجرى لخروج دم الحيض"],["For uterine secretions to pass down through the introitus","تسمح للسوائل الرحمية بالمرور عبر فتحة المهبل"],["all of the above","كل ما سبق"]],"c":3,"ex":"المهبل قناة الولادة وممر لدم الحيض وللإفرازات الرحمية؛ جميع ما سبق."},{"en":"The progesterone is secreted by:","ar":"يُفرز هرمون البروجسترون بواسطة:","o":[["Graafian follicle","الجريب الجرافي"],["Anterior pituitary gland","الغدة النخامية الأمامية"],["corpus luteum","الجسم الأصفر"],["posterior pituitary gland","الغدة النخامية الخلفية"]],"c":2,"ex":"البروجسترون يُفرز بشكل أساسي من الجسم الأصفر (corpus luteum)."},{"en":"The middle portion of the uterus is called:","ar":"يُسمى الجزء الأوسط من الرحم بـ:","o":[["Fundus","القاع"],["Body","الجسم"],["Cervix","عنق الرحم"],["All of the above","جميع ما سبق"]],"c":1,"ex":"الجزء الأوسط من الرحم هو الجسم (body): القاع أعلى، والعنق أسفل."},{"en":"Which of the following statements is correct about menstruation?","ar":"أي من العبارات التالية صحيحة عن الحيض؟","o":[["The proliferative phase start from 15-28 days","تبدأ المرحلة التكاثرية من اليوم 15 إلى 28"],["Normal menstrual cycle occurs every 40 days","تحدث الدورة الشهرية الطبيعية كل 40 يومًا"],["Menstrual phase if pregnancy does not occur","تحدث مرحلة الحيض إذا لم يحدث حمل"],["The secretory phase from 5-14 days & it involves early proliferation of endometrium","المرحلة الإفرازية من اليوم 5 إلى 14 وتشمل التكاثر المبكر لبطانة الرحم"]],"c":2,"ex":"مرحلة الحيض تحدث إذا لم يحدث حمل؛ المرحلة التكاثرية من 5-14 والإفرازية من 15-28، والدورة الطبيعية كل 25-32 يومًا."},{"en":"Which of the following statements is not correct about uterus:","ar":"أي من العبارات التالية غير صحيحة عن الرحم؟","o":[["Hallow muscular & thick-walled organ","عضو مجوف عضلي سميك الجدار"],["Its main functions are pregnancy & labor","وظائفه الرئيسية هي الحمل والولادة"],["Bladder is posterior while rectum is anterior","المثانة خلفية بينما المستقيم أمامي"],["Anatomically divided into: fundus, body & cervix","يُقسم تشريحيًا إلى: القاع، الجسم، وعنق الرحم"]],"c":2,"ex":"العبارة غير الصحيحة هي الثالثة: الصحيح أن المثانة أمامية (anterior) والمستقيم خلفي (posterior) بالنسبة للرحم."},{"en":"All the following open into vaginal vestibule except:","ar":"كل ما يلي يفتح في الدهليز المهبلي ما عدا:","o":[["Cervical opening","فتحة عنق الرحم"],["Bartholin's glands","غدد بارثولين"],["Urethral meatus","فتحة الإحليل"],["vaginal opening","الفتحة المهبلية"]],"c":0,"ex":"فتحة عنق الرحم تفتح في المهبل نفسه وليس في الدهليز؛ أما فتحة المهبل والإحليل وقنوات غدد بارثولين فتفتح في الدهليز."},{"en":"If fertilization doesn't occur, the corpus luteum degenerates at:","ar":"إذا لم يحدث إخصاب، فإن الجسم الأصفر يتحلل في:","o":[["6th day of cycle","اليوم السادس من الدورة"],["14th days of cycle","اليوم الرابع عشر من الدورة"],["22-24th days of cycle","من اليوم 22 إلى 24 من الدورة"],["1st day of cycle","اليوم الأول من الدورة"]],"c":2,"ex":"عند عدم حدوث الإخصاب يتحلل الجسم الأصفر حوالي اليوم 22-24 من الدورة."},{"en":"During the menstrual cycle, the secretory phase is under the effect of:","ar":"خلال الدورة الشهرية، تكون المرحلة الإفرازية تحت تأثير:","o":[["L.H","هرمون اللوتين"],["Estrogen","الإستروجين"],["F.S.H","الهرمون المنبه للجريب"],["Progesterone","البروجسترون"],["Both b & d","كل من ب و د"]],"c":4,"ex":"المرحلة الإفرازية تحت تأثير الإستروجين والبروجسترون معًا (مع غلبة البروجسترون)."},{"en":"The fallopian tubes composed of all of the following except:","ar":"تتكون قناتا فالوب من كل ما يلي ما عدا:","o":[["Interstitial part","الجزء البيني"],["Infundibulum","القمع"],["cervix","عنق الرحم"],["Ampulla","الأمبولة"]],"c":2,"ex":"عنق الرحم جزء من الرحم وليس من قناة فالوب؛ أجزاء القناة: الجزء البيني، البرزخ، الأمبولة، القمع."},{"en":"The weight of non-gravida uterus ranges from:","ar":"يتراوح وزن الرحم غير الحامل من:","o":[["900-1000 gm",""],["50-60 gm",""],["20-30 gm",""],["80-90 gm",""]],"c":1,"ex":"وزن الرحم غير الحامل يتراوح بين 50 و60 جرامًا."},{"en":"The ovulation, the outward expulsion of mature ovum, typically occurs around which day in 28 day menstrual cycle:","ar":"التبويض، وهو خروج البويضة الناضجة، يحدث عادةً في أي يوم من دورة شهرية مدتها 28 يومًا؟","o":[["Day 10","اليوم العاشر"],["Day 7","اليوم السابع"],["Day 28","اليوم الثامن والعشرون"],["Day 14","اليوم الرابع عشر"]],"c":3,"ex":"الإباضة تحدث عادة حوالي اليوم 14 في دورة مدتها 28 يومًا."},{"en":"Menstrual cycle usually occurs every:","ar":"تحدث الدورة الشهرية عادةً كل:","o":[["20 to 25 days","من 20 إلى 25 يومًا"],["25 to 32 days","من 25 إلى 32 يومًا"],["35 to 40 days","من 35 إلى 40 يومًا"]],"c":1,"ex":"الدورة الشهرية الطبيعية تحدث عادة كل 25 إلى 32 يومًا."},{"en":"Ovarian cycle includes all the following Except:","ar":"تشمل دورة المبيض كل ما يلي ما عدا:","o":[["Follicular phase","الطور الجريبي"],["Ischemic phase","الطور الإقفاري"],["Ovulatory phase","طور التبويض"],["Luteal phase","الطور الأصفري"]],"c":1,"ex":"الطور الإقفاري (ischemic) من أطوار الدورة الشهرية الرحمية وليس من الدورة المبيضية."},{"en":"Menstrual cycle includes the following Except:","ar":"تشمل الدورة الشهرية كل ما يلي ما عدا:","o":[["Luteal phase","الطور الأصفري"],["Menstrual phase","طور الحيض"],["Secretory phase","الطور الإفرازي"],["Ischemic phase","الطور الإقفاري"]],"c":0,"ex":"الطور الأصفر (luteal) من أطوار الدورة المبيضية وليس من الدورة الشهرية؛ أطوار الدورة الشهرية: الحيض والتكاثري (والإفرازي والإقفاري)."},{"en":"Women's reproductive health needs include all the following Except:","ar":"تشمل احتياجات الصحة الإنجابية للمرأة كل ما يلي ما عدا:","o":[["Keeping labor normal","الحفاظ على سير الولادة بصورة طبيعية"],["Pregnancy, childbirth & postnatal care","رعاية الحمل والولادة وما بعد الولادة"],["Protection against prostatic hypertrophy","الوقاية من تضخم البروستاتا"]],"c":2,"ex":"تضخم البروستاتا حالة تخص الرجال ولا علاقة لها بالصحة الإنجابية للمرأة."},{"en":"Fertilization of a mature ovum occurs in:","ar":"يحدث إخصاب البويضة الناضجة في:","o":[["Uterus","الرحم"],["Ovary","المبيض"],["Ampulla of the fallopian tube","أمبولة قناة فالوب"],["Wall of the myometrium","جدار عضلة الرحم"]],"c":2,"ex":"إخصاب البويضة الناضجة يحدث في أمبولة قناة فالوب."},{"en":"Repair of the endometrium layer takes place for 9 days after menstruation under the effect of estrogen and is called:","ar":"يحدث إصلاح طبقة بطانة الرحم لمدة 9 أيام بعد الحيض تحت تأثير هرمون الإستروجين ويُسمى:","o":[["Secretory phase","الطور الإفرازي"],["Proliferative phase","الطور التكاثري"],["Menstrual phase","طور الحيض"],["Follicular phase","الطور الجريبي"]],"c":1,"ex":"إصلاح بطانة الرحم بعد الحيض تحت تأثير الإستروجين هو المرحلة التكاثرية (proliferative)."},{"en":"Which hormone is secreted by the syncytiotrophoblast to keep the corpus luteum active if fertilization occur:","ar":"أي هرمون يفرز من الطبقة الخارجية للمشيمة للحفاظ على الجسم الأصفر نشطًا إذا حدث إخصاب؟","o":[["follicle stimulating hormone (FSH)","الهرمون المنبه للجريب"],["luteinizing hormone (LH)","الهرمون اللوتيني"],["human chorionic gonadotropin (HCG)","هرمون الحمل HCG"],["oxytocin","الأوكسيتوسين"]],"c":2,"ex":"الأرومة الغاذية المزجية (syncytiotrophoblast) تفرز هرمون HCG للحفاظ على الجسم الأصفر نشطًا بعد الإخصاب."},{"en":"Repair of the endometrial layer takes place for 9 days after menstruation under the effect of estrogen. This phase is called:","ar":"يحدث إصلاح طبقة بطانة الرحم لمدة 9 أيام بعد الحيض تحت تأثير هرمون الإستروجين. وتسمى هذه المرحلة:","o":[["Menstrual phase","مرحلة الحيض"],["Proliferative phase","المرحلة التكاثرية"],["Secretory phase","المرحلة الإفرازية"],["Ischemic phase","المرحلة الإقفارية"]],"c":1,"ex":"هذه هي المرحلة التكاثرية (proliferative phase)."}]};
const { STAGES, PHRASES, tfData, mcqData } = DATA;
const TYPE_NAMES = { tf: 'صح / خطأ', mcq: 'اختر الإجابة' };
const keyOf = (t, s) => t + '_' + s;
const LS_KEY = 'ob-progress.v1';

let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) { progress = {}; }
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {} }

let screen = 'menu', type = 'mcq', stage = 1, order = [], index = 0, answers = [];
let pending = null, resetArmed = false, warn = false, tick = 0;

setInterval(() => { tick++; document.querySelectorAll('.motivation').forEach(el => el.textContent = PHRASES[tick % PHRASES.length]); }, 6000);
const phrase = () => PHRASES[tick % PHRASES.length];

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function list() { return type === 'mcq' ? mcqData : tfData; }
function stageList() { const [a, b] = STAGES[type][stage - 1]; return list().slice(a, b); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function savePatch(patch) {
  progress[keyOf(type, stage)] = Object.assign({ done: false, order, index, answers }, patch);
  persist();
}

function startFresh(t, s) {
  const [a, b] = STAGES[t][s - 1];
  order = shuffle(Array.from({ length: b - a }, (_, k) => k));
  type = t; stage = s; index = 0; answers = []; warn = false; pending = null;
  delete progress[keyOf(t, s)]; persist();
  screen = 'quiz'; render();
}

function loadSaved(t, s, sv) {
  const [a, b] = STAGES[t][s - 1]; const len = b - a;
  let ord = Array.isArray(sv.order) ? sv.order.slice() : [];
  if (ord.length !== len || ord.some(x => typeof x !== 'number' || x < 0 || x >= len)) {
    ord = ord.map(x => x - a);
    if (ord.length !== len || ord.some(x => x < 0 || x >= len)) ord = Array.from({ length: len }, (_, k) => k);
  }
  type = t; stage = s; order = ord; answers = Array.isArray(sv.answers) ? sv.answers : [];
  index = sv.done ? ord.length : Math.min(sv.index, ord.length - 1);
  warn = false; pending = null;
  screen = sv.done ? 'results' : 'quiz'; render();
}

function clickStage(s) {
  const sv = progress[keyOf(type, s)];
  if (!sv) { startFresh(type, s); return; }
  pending = (pending === s) ? null : s; render();
}

function answer(pick, isC) {
  if (answers[index]) return;
  answers[index] = { p: pick, c: isC }; warn = false;
  savePatch({ answers }); render();
}

function goNext() {
  if (!answers[index]) { warn = true; render(); return; }
  const ni = index + 1; warn = false;
  if (ni >= order.length) {
    const score = answers.filter(a => a && a.c).length;
    savePatch({ index: ni, done: true, score, total: order.length });
    index = ni; screen = 'results';
  } else { index = ni; savePatch({ index: ni }); }
  render();
}
function goPrev() { if (index > 0) { warn = false; index--; render(); } }

function resetAll() {
  if (!resetArmed) { resetArmed = true; render(); return; }
  progress = {}; persist(); resetArmed = false; pending = null; render();
}

function correctText(qq) { return type === 'mcq' ? qq.o[qq.c][0] : (qq.c ? 'صح (True)' : 'خطأ (False)'); }

function motivationHTML() { return '<div class="motivation">' + esc(phrase()) + '</div>'; }

function render() {
  const app = document.getElementById('app');
  let h = '';
  if (screen === 'menu') {
    h += '<div class="section">' + motivationHTML();
    h += '<div class="grouplabel">اختار نوع الأسئلة</div>';
    h += '<div class="btnrow">';
    h += '<button class="btn btn-primary" onclick="goStages(\'mcq\')">اختر الإجابة الصحيحة (34 سؤال)</button>';
    h += '<button class="btn btn-secondary" onclick="goStages(\'tf\')">صح / خطأ (46 سؤال)</button>';
    h += '</div></div>';
    h += '<div class="section"><div class="grouplabel" style="font-size:14px;font-family:var(--sans);font-weight:600;">البداية من جديد</div>';
    h += '<div class="btnrow"><button class="btn btn-ghost btn-compact" onclick="resetAll()">' + (resetArmed ? 'متأكد؟ اضغط تاني عشان تمسح كل حاجة' : 'مسح كل التقدم المحفوظ') + '</button></div>';
    h += '</div>';
  } else if (screen === 'stages') {
    h += '<div class="section">' + motivationHTML();
    h += '<div class="grouplabel">مراحل ' + TYPE_NAMES[type] + '</div>';
    h += '<div class="stagelist">';
    STAGES[type].forEach(([a, b], k) => {
      const s = k + 1; const sv = progress[keyOf(type, s)];
      let badge = (b - a) + ' سؤال';
      if (sv && sv.done) badge = 'خلصتها: ' + sv.score + ' من ' + sv.total;
      else if (sv && sv.answers.some(x => x)) badge = 'واقف عند سؤال ' + (sv.index + 1);
      h += '<div><button type="button" class="stage" onclick="clickStage(' + s + ')"><span>المرحلة ' + s + '</span><span class="badge">' + badge + '</span></button>';
      if (pending === s && sv) {
        h += '<div class="stagechoice">';
        if (sv.done) h += '<button class="btn btn-secondary btn-compact" onclick="loadSaved(\'' + type + '\',' + s + ')">شوف نتيجتك (' + sv.score + ' من ' + sv.total + ')</button>';
        else h += '<button class="btn btn-primary btn-compact" onclick="loadSaved(\'' + type + '\',' + s + ')">كمّل من سؤال ' + (sv.index + 1) + '</button>';
        h += '<button class="btn btn-ghost btn-compact" onclick="startFresh(\'' + type + '\',' + s + ')">ابدأ من الأول</button></div>';
      }
      h += '</div>';
    });
    h += '</div><div class="btnrow"><button class="btn btn-ghost btn-compact" onclick="goMenu()">رجوع للرئيسية</button></div></div>';
  } else if (screen === 'quiz') {
    const qs = stageList(); const qi = order[index]; const q = qs[qi];
    const cur = answers[index]; const answered = !!cur;
    const correctCount = answers.filter(a => a && a.c).length;
    h += '<div class="section">';
    h += '<div class="scorebar"><span>النجوم: ' + correctCount + ' من ' + qs.length + '</span><span>سؤال ' + (index + 1) + ' من ' + qs.length + '</span></div>';
    h += '<div class="track"><div class="fill" style="width:' + (index / qs.length * 100) + '%"></div></div>';
    h += '<div class="q">' + (index + 1) + '. ' + esc(q.en) + '</div>';
    if (q.ar) h += '<div class="qar">' + esc(q.ar) + '</div>';
    h += '<div class="options">';
    if (type === 'mcq') {
      q.o.forEach((opt, oi) => {
        let cls = 'opt';
        if (answered) { cls += ' locked'; if (oi === q.c) cls += ' correct'; else if (oi === cur.p) cls += ' wrong'; }
        h += '<button type="button" class="' + cls + '" onclick="answer(' + oi + ',' + (oi === q.c) + ')">';
        h += '<span class="open">' + esc(opt[0]) + '</span>';
        if (opt[1]) h += '<span class="opar">' + esc(opt[1]) + '</span>';
        h += '</button>';
      });
    } else {
      [[true, 'صح (True)'], [false, 'خطأ (False)']].forEach(([val, label], oi) => {
        let cls = 'opt';
        if (answered) { cls += ' locked'; if ((oi === 0) === q.c) cls += ' correct'; else if (oi === cur.p) cls += ' wrong'; }
        h += '<button type="button" class="' + cls + '" onclick="answer(' + oi + ',' + (val === q.c) + ')">' + label + '</button>';
      });
    }
    h += '</div>';
    if (answered) {
      h += '<div class="feedback ' + (cur.c ? 'ok' : 'no') + '"><strong>' + (cur.c ? 'إجابة صحيحة!' : 'إجابة خطأ') + '</strong>';
      h += '<div>الإجابة الصحيحة: <bdi dir="ltr">' + esc(correctText(q)) + '</bdi></div>';
      h += '<div>' + esc(q.ex) + '</div></div>';
    }
    if (warn && !answered) h += '<div class="feedback no"><strong>اختار إجابة الأول يا نجم</strong></div>';
    h += motivationHTML();
    h += '<div class="nav"><button class="btn btn-secondary btn-compact" onclick="goPrev()">السابق</button>';
    h += '<button class="btn btn-primary btn-compact" onclick="goNext()">' + (index + 1 === qs.length ? 'خلّص المرحلة' : 'التالي') + '</button></div>';
    h += '<div class="btnrow"><button class="btn btn-ghost btn-compact" onclick="goStagesKeep()">رجوع للمراحل (تقدّمك محفوظ)</button></div>';
    h += '</div>';
  } else if (screen === 'results') {
    const qs = stageList();
    const score = answers.filter(a => a && a.c).length;
    const pct = qs.length ? score / qs.length : 0;
    const resultMsg = pct === 1 ? 'ممتاز! علامة كاملة، إنت وحش' : pct >= 0.75 ? 'كويس جدًا! شوية مراجعة وتبقى تمام' : pct >= 0.5 ? 'ماشي الحال.. راجع أخطاءك وحاول تاني' : 'متزعلش، الغلط أول خطوة للفهم. راجع وجرب تاني';
    const mistakes = order.map((qi, i) => ({ qq: qs[qi], a: answers[i], i })).filter(x => !x.a || !x.a.c);
    h += '<div class="section"><div class="grouplabel">انتهت المرحلة</div>';
    h += '<div class="results"><div class="bigscore">درجتك: ' + score + ' من ' + qs.length + '</div><div class="resultmsg">' + resultMsg + '</div></div>';
    if (mistakes.length === 0) h += '<div class="feedback ok"><strong>لا توجد أخطاء! إتقان رائع</strong></div>';
    else {
      h += '<div class="mistakes"><div class="mtitle">راجع أخطاءك:</div>';
      mistakes.forEach(({ qq }) => {
        h += '<div class="mitem"><div class="men">' + esc(qq.en) + '</div>';
        h += '<div>الإجابة الصحيحة: <bdi dir="ltr">' + esc(correctText(qq)) + '</bdi></div>';
        h += '<div class="mex">' + esc(qq.ex) + '</div></div>';
      });
      h += '</div>';
    }
    h += '<div class="nav"><button class="btn btn-secondary btn-compact" onclick="startFresh(\'' + type + '\',' + stage + ')">إعادة نفس المرحلة</button>';
    if (stage < STAGES[type].length) h += '<button class="btn btn-primary btn-compact" onclick="nextStage()">المرحلة التالية</button>';
    h += '</div><div class="btnrow"><button class="btn btn-ghost btn-compact" onclick="goStagesKeep()">رجوع للمراحل</button></div></div>';
  }
  app.innerHTML = h;
}

function goStages(t) { type = t; pending = null; screen = 'stages'; render(); }
function goStagesKeep() { pending = null; screen = 'stages'; render(); }
function goMenu() { pending = null; screen = 'menu'; render(); }
function nextStage() {
  const ns = stage + 1; const sv = progress[keyOf(type, ns)];
  if (sv) { pending = ns; screen = 'stages'; render(); } else startFresh(type, ns);
}
render();
</script>
</body>
</html>
